[project]
name = "modeldock"
version = "0.1.0"
description = "Production-style ML inference server: dynamic batching, backpressure, caching, canary rollouts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Stage 0 keeps runtime deps to what the skeleton actually imports.
# Each later stage adds its own (redis, sqlalchemy, torch, ...), so every
# dependency arrives together with the code that needs it.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Both process types talk to Redis: redis.asyncio in the API, the sync client in the worker.
    "redis>=5.0",
]

[project.optional-dependencies]
# Worker-only dependencies, installed with `uv sync --extra worker`.
# API processes never load models (D3), so their install (and later their
# Docker image) leaves out PyTorch and friends entirely: several hundred MB.
worker = [
    "torch>=2.15",
    "transformers>=5.0",
    "scikit-learn>=1.9",
    "joblib>=1.6",
    "numpy>=2.0",
]

# On Linux, PyPI's torch wheel is the CUDA build and pulls in ~3 GB of NVIDIA
# libraries we'd never use. Point Linux at PyTorch's CPU-only wheel index.
# macOS and Windows wheels on PyPI are already CPU-only, so they use PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # only packages listed in [tool.uv.sources] come from here

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    # Real Redis behaviour without a server, for the unit tests. Tests marked
    # `redis` use a real server instead (see tests/conftest.py).
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Three top-level packages instead of one src/ package: the API and the worker
# are separate deployables that share only `common`.
packages = ["api", "worker", "common"]
# scripts/ is deliberately not packaged: developer tools, run from the repo
# root with `uv run python -m scripts.<name>`.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "redis: needs a real Redis server at TEST_REDIS_URL (skipped if unreachable)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear (likely bugs),
# UP: modern syntax, ASYNC: blocking calls inside async code (matters a lot
# for this project, where blocking the event loop is a design concern).
select = ["E", "F", "I", "B", "UP", "ASYNC"]
