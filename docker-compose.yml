# Backing services for local development.
# The API and worker run on the host with `uv run`; benchmark numbers come from that native
# setup (C1.15). Stage 5 adds api/worker containers here, Stage 6 adds Prometheus.
#
# First-release scope (C1.23): Redis is the only backing service. Postgres returns with
# stretch stage S1 (rate limiting), and MinIO with the model registry (future work).

name: modeldock

services:
  redis:
    image: redis:7.4-alpine
    # appendonly off: queues and reply lists are ephemeral by design
    # (see D12: in-flight requests are not recovered). No disk persistence needed.
    # No maxmemory/eviction policy on this instance: evicting a queue or a reply list would
    # lose requests. The response cache (stretch S2) gets its own instance (C1.22, R12).
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
